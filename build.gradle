buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'

        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.7.6"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Resolve Sency's Android 1.9.4 artifacts only from the sibling checkout.
        exclusiveContent {
            forRepository { maven { url rootProject.file('../smkit_android/repo').toURI() } }
            filter {
                includeGroupByRegex 'com\\.sency.*'
                includeVersion 'androidx.camera', 'camera-core', '1.1.0.1-sency16kb'
            }
        }
        maven {
            url "https://artifacts.sency.ai/artifactory/release"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
