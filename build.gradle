buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'

        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.7.6"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // An explicit local candidate repository keeps every SDK layer on the same release.
        def localSdkRepo = providers.gradleProperty("smkitLocalRepo")
            .orElse(providers.environmentVariable("SMKIT_LOCAL_REPO"))
        exclusiveContent {
            forRepository { maven {
                url localSdkRepo.isPresent() ? uri(localSdkRepo.get()) : uri("https://artifacts.sency.ai/artifactory/release")
            } }
            filter {
                includeGroupByRegex 'com\\.sency.*'
                includeVersion 'androidx.camera', 'camera-core', '1.1.0.1-sency16kb'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
