plugins {
    id('com.android.application')
    id('kotlin-android')
    id('kotlin-kapt')
    id('androidx.navigation.safeargs.kotlin')
    id('kotlin-parcelize')
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def sdkAuthKey = localProperties.getProperty("sdk_auth_key", "")
def cameraXCompatibilityVersion = "1.1.0"
def cameraXCoreCompatibilityVersion = "1.1.0.1-sency16kb"
def appCompatCompatibilityVersion = "1.4.2"
def coroutinesCompatibilityVersion = "1.5.0"

// Exercise SMKitUI's published compatibility floor instead of allowing newer
// transitive AndroidX/Lifecycle dependencies to silently upgrade these modules.
configurations.configureEach {
    resolutionStrategy.force(
        "androidx.camera:camera-core:${cameraXCoreCompatibilityVersion}",
        "androidx.camera:camera-camera2:${cameraXCompatibilityVersion}",
        "androidx.camera:camera-lifecycle:${cameraXCompatibilityVersion}",
        "androidx.camera:camera-view:${cameraXCompatibilityVersion}",
        "androidx.appcompat:appcompat:${appCompatCompatibilityVersion}",
        "androidx.appcompat:appcompat-resources:${appCompatCompatibilityVersion}",
        "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutinesCompatibilityVersion}",
        "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${coroutinesCompatibilityVersion}",
        "org.jetbrains.kotlinx:kotlinx-coroutines-android:${coroutinesCompatibilityVersion}",
    )
}

android {
    namespace 'com.example.smkituidemoapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.smkituidemoapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.8.2"

        buildConfigField 'boolean', 'IS_PROD', "false"
        buildConfigField "String", "sdk_auth_key", "\"${sdkAuthKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            manifestPlaceholders = [appIcon: "@mipmap/ic_launcher_dev"]
            shrinkResources false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField 'boolean', 'IS_PROD', "true"

            manifestPlaceholders = [appIcon: "@mipmap/ic_launcher_prod"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        pickFirst '**/*.so'
    }
}

dependencies {
    implementation 'com.sency.smkitui:smkitui:1.8.2'
    // SMKitUI's public configuration surface exposes PoseModelChoice from SMKit.
    implementation 'com.sency.smkit:smkit:1.8.2'
    // FormFeedbackType is also part of the public SMKitUI API surface.
    implementation 'com.sency.smbase.nativeclient:smbase-native-client:1.8.2'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "androidx.appcompat:appcompat:${appCompatCompatibilityVersion}"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.android.material:material:1.11.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.2'

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"

    // Kotlin components
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutinesCompatibilityVersion}"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:${coroutinesCompatibilityVersion}"

}
